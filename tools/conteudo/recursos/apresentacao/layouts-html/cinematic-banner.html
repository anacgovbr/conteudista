<!-- Layout: cinematic-banner — abertura dramática com imagem full-bleed e scrim. Sem imagem, cai para marquee-statement. -->
<style>
.s.fs-cinematic-banner{background:var(--c-fundo)}
.s.fs-cinematic-banner .in{left:0;right:0;top:0;bottom:0;display:flex;align-items:flex-end;padding:80px}
.s.fs-cinematic-banner .conteudo{position:relative;max-width:1000px}
.s.fs-cinematic-banner .conteudo figure{position:absolute;inset:-80px;margin:0;z-index:0}
.s.fs-cinematic-banner .conteudo figure img{width:100%;height:100%;object-fit:cover;object-position:center;max-height:none}
.s.fs-cinematic-banner .conteudo figure::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.35) 55%,transparent);
}
.s.fs-cinematic-banner h1,.s.fs-cinematic-banner p{
  position:relative;z-index:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.s.fs-cinematic-banner h1{font-family:var(--font-display);font-size:64px;line-height:1.1;border:0;padding:0;margin:0 0 16px}
.s.fs-cinematic-banner p{font-size:17px;color:rgba(255,255,255,.82)}
</style>
<template>
<div class="fs-layout fs-cinematic" data-slot="root">
  <img data-slot="image" src="" alt="">
  <div data-slot="scrim"></div>
  <h1 data-slot="title">Título</h1>
  <p data-slot="caption">Caption ou fonte</p>
</div>
</template>
