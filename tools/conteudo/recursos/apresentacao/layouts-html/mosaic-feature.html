<!-- Layout: mosaic-feature — portfólio/showcase com três imagens. Sem imagens, cai para split-accent. -->
<style>
.s.fs-mosaic-feature{background:var(--c-fundo)}
.s.fs-mosaic-feature .in{left:0;right:0;top:0;bottom:0;display:block}
.s.fs-mosaic-feature .conteudo{height:100%;display:grid;grid-template-columns:40% 60%}
.s.fs-mosaic-feature .conteudo>*:first-child{padding:60px 48px;align-self:center}
.s.fs-mosaic-feature h2{
  font-family:var(--font-display);font-size:44px;line-height:1.1;border:0;padding:0;
  margin:0 0 20px;color:var(--token-heading-color);
}
.s.fs-mosaic-feature p{font-size:16px;line-height:1.55;color:var(--token-body-color)}
.s.fs-mosaic-feature .conteudo figure{
  margin:0;display:grid;grid-template-columns:60% 40%;grid-template-rows:70% 30%;
  gap:4px;padding:4px;background:var(--c-linha);
}
.s.fs-mosaic-feature figure img{width:100%;height:100%;object-fit:cover;max-height:none}
.s.fs-mosaic-feature figure img:first-child{grid-row:1/3;grid-column:1}
.s.fs-mosaic-feature figure img:nth-child(2){grid-row:1;grid-column:2}
.s.fs-mosaic-feature figure img:nth-child(3){grid-row:2;grid-column:2}
</style>
<template>
<div class="fs-layout fs-mosaic" data-slot="root">
  <div data-slot="text"><h2 data-slot="title">Título</h2><p data-slot="body">Descrição</p><div data-slot="chips"><span data-slot="chip">Tag</span></div></div>
  <div data-slot="image-mosaic"><img data-slot="image-1" src="" alt=""><img data-slot="image-2" src="" alt=""><img data-slot="image-3" src="" alt=""></div>
</div>
</template>
