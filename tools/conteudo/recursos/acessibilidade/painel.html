if(!p||!b)return;function saved(k,def){try{var v=localStorage.getItem('conteudista.gerados.'+k);return v===null?def:v==='1'}catch(e){return def}}

[['contraste','a11y-contrast',false],['espacamento','a11y-spacing',false],['movimento','a11y-reduce',false],['legendas','a11y-legendas-on',true],['barra','a11y-barra-fixa',false],['atalhos','a11y-atalhos',true]].forEach(function(x){var c=ctrl(x[0]);if(!c)return;var on=saved(x[0],x[2]);c.checked=on;h.classList.toggle(x[1],on);c.addEventListener('change',function(){h.classList.toggle(x[1],c.checked);set(x[0],c.checked);if(x[0]==='legendas')falaLegenda();if(x[0]==='barra')d.dispatchEvent(new CustomEvent('conteudista:barra-fixa',{detail:c.checked}));if(x[0]==='atalhos'){marcarAtalhos(c.checked);estado(c.checked?'Atalhos de uma tecla ligados.':'Atalhos de uma tecla desligados. Use Alt+Shift e a letra.');d.dispatchEvent(new CustomEvent('conteudista:atalhos',{detail:c.checked}))}})});
marcarAtalhos(saved('atalhos',true));
var rg=ctrl('regua');if(rg)rg.addEventListener('change',function(){if(r)r.style.display=rg.checked?'block':'none';if(rg.checked)setTimeout(function(){if(rg.checked&&r)r.style.top=(innerHeight*.35)+'px'},0)});

/* 1.91 (WCAG 1.4.2): leitura em voz alta com Parar. Para ao clicar de novo, ao fechar o painel e ao mudar de slide ou de modo. */
var btnOuvir=ctrl('ouvir'),htmlOuvir=btnOuvir?btnOuvir.innerHTML:'',falaAtual=null;

function marcarOuvir(on){if(!btnOuvir)return;btnOuvir.setAttribute('aria-pressed',on?'true':'false');if(on)btnOuvir.textContent='Parar leitura';else btnOuvir.innerHTML=htmlOuvir}
function pararLeitura(msg){if(!falaAtual)return;falaAtual=null;try{speechSynthesis.cancel()}catch(e){}marcarOuvir(false);if(msg)estado(msg)}
function ouvir(){if(!('speechSynthesis'in window)){estado('A leitura em voz alta não está disponível neste navegador.');return}if(falaAtual){pararLeitura('Leitura interrompida.');return}speechSynthesis.cancel();var alvo=d.querySelector('.s.on .conteudo')||d.querySelector('main article')||d.querySelector('main');var u=new SpeechSynthesisUtterance(alvo?(alvo.innerText||alvo.textContent):d.body.innerText);u.lang='pt-BR';u.onend=function(){if(falaAtual!==u)return;falaAtual=null;marcarOuvir(false);estado('Leitura concluída.')};u.onerror=function(){if(falaAtual!==u)return;falaAtual=null;marcarOuvir(false);estado('Leitura interrompida.')};falaAtual=u;marcarOuvir(true);speechSynthesis.speak(u);estado('Leitura em voz alta iniciada. Use Parar leitura para interromper.')}

function vlibras(btn){estado('Carregando VLibras. É necessário acesso à internet.');function iniciar(){if(window.VLibras&&window.VLibras.Widget){new window.VLibras.Widget('https://vlibras.gov.br/app');loaded=true;estado('VLibras carregado.');btn.disabled=true;btn.textContent='VLibras ativado'}}if(loaded){iniciar();return}if(window.VLibras){iniciar();return}var s=d.createElement('script');s.src='https://vlibras.gov.br/app/vlibras-plugin.js';s.async=true;s.onload=iniciar;s.onerror=function(){estado('Não foi possível carregar VLibras. Verifique a conexão.')};d.head.append(s)}

addEventListener('pointermove',function(e){if(rg&&rg.checked&&r)r.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-20))+'px'},{passive:true});addEventListener('keydown',function(e){if(e.key==='Escape'&&p.open)b.setAttribute('aria-expanded','false')},true);
