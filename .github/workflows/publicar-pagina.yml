name: Publicar página do Conteudista

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/**"
      - ".github/workflows/publicar-pagina.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalar dependências
        run: pip install -r tools/requirements.txt

      - name: Testar o gerador com o curso de exemplo
        run: python tools/gerador.py web/exemplo/guia.md web/exemplo/apresentacao.md --prefixo Exemplo --rodape "Teste" --saida /tmp/teste

      - name: Verificar sintaxe dos scripts da página
        run: node --check web/editor.js

      - name: Montar a página (sem nenhum curso salvo)
        run: |
          mkdir -p site/wheels
          cp web/index.html web/editor.js tools/gerador.py site/
          cp -r web/exemplo site/exemplo
          pip download --no-deps --only-binary=:all: --dest site/wheels python-docx python-pptx XlsxWriter typing_extensions
          python -c "import os,json;json.dump(sorted(f for f in os.listdir('site/wheels') if f.endswith('.whl')),open('site/wheels/wheels.json','w'))"
          touch site/.nojekyll
          ls -R site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
