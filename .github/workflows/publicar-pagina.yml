name: Publicar página do Conteudista

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/**"
      - "CHANGELOG.md"
      - "MIGRACAO-LOCUCAO.md"
  workflow_dispatch:
    inputs:
      executar_testes:
        description: "Executar novamente a bateria de navegador"
        type: boolean
        required: false
        default: true
      executar_verificacao:
        description: "Executar novamente a verificação completa sem navegador"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalar dependências
        run: pip install -r tools/requirements.txt

      - name: Verificar tudo (gerador, acessibilidade das saídas, biblioteca, lac, opções, pacotes, sintaxe)
        if: github.event_name != 'workflow_dispatch' || inputs.executar_verificacao
        run: bash tools/verificar.sh

      - name: Guardar o relatório SARIF do conteúdo de exemplo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linguagem-acessivel-sarif
          path: linguagem-acessivel.sarif
          if-no-files-found: ignore

      - name: Montar a página (sem nenhum curso salvo)
        run: |
          mkdir -p site/wheels
          cp web/index.html web/*.js web/*.css tools/gerador.py site/
          cp -r web/config site/config
          cp -r web/lib site/lib
          cp -r tools/temas site/temas
          cp -r tools/fontes site/fontes
          cp -r web/exemplo site/exemplo
          cp CHANGELOG.md site/
          pip download --no-deps --only-binary=:all: --dest site/wheels python-docx python-pptx XlsxWriter typing_extensions
          python -c "import os,json;json.dump(sorted(f for f in os.listdir('site/wheels') if f.endswith('.whl')),open('site/wheels/wheels.json','w'))"
          touch site/.nojekyll
          ls -R site

      - name: Chave do cache dos modelos
        id: chave_modelos
        env:
          MODELOS_LOCAIS: ${{ vars.MODELOS_LOCAIS || 'piper-ptbr,piper-catalogo' }}
        run: echo "perfis=$(echo "$MODELOS_LOCAIS" | tr -c 'A-Za-z0-9_.-' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache dos modelos de voz
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .cache/modelos
          key: modelos-${{ hashFiles('web/modelos.json') }}-${{ steps.chave_modelos.outputs.perfis }}

      - name: Hospedar modelos de voz no site (opcional)
        continue-on-error: true
        env:
          MODELOS_LOCAIS: ${{ vars.MODELOS_LOCAIS || 'piper-ptbr,piper-catalogo' }}
          BIBLIOTECAS_LOCAIS: ${{ vars.BIBLIOTECAS_LOCAIS || 'piper,kokoro,espeak,lamejs' }}
        run: |
          python tools/hospedar_modelos.py --config web/modelos.json --saida site --cache .cache/modelos --perfis "$MODELOS_LOCAIS" --bibliotecas "$BIBLIOTECAS_LOCAIS"
          du -sh site || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Roteiro de validação no Google Chrome (tools/testes). Se falhar, a página não é publicada.
  testes:
    if: github.event_name != 'workflow_dispatch' || inputs.executar_testes
    uses: ./.github/workflows/testes-navegador.yml
    with:
      navegadores: '["chrome"]'

  deploy:
    needs: [build, testes]
    if: always() && needs.build.result == 'success' && (needs.testes.result == 'success' || needs.testes.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
