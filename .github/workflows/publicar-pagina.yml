name: Publicar página do Conteudista

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      executar_testes:
        description: "Compatibilidade: os testes de publicação são sempre obrigatórios"
        type: boolean
        required: false
        default: true
      executar_verificacao:
        description: "Compatibilidade: a verificação de publicação é sempre obrigatória"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  classificar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.plano.outputs.publicar || 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Selecionar publicação pela mesma classificação
        id: plano
        continue-on-error: true
        env:
          BASE: ${{ github.event.before || 'HEAD~1' }}
          EVENTO: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python tools/testes/classificar_mudancas.py --base "$BASE" --head HEAD --evento "$EVENTO" --branch "$BRANCH" --saida selecao-publicacao.json
          if [ "$EVENTO" = workflow_dispatch ]; then echo 'publicar=true' >> "$GITHUB_OUTPUT"; fi

  build:
    needs: classificar
    if: needs.classificar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.lock
            tools/testes/requirements.lock

      - name: Instalar dependências
        run: pip install --require-hashes -r tools/requirements.lock -r tools/testes/requirements.lock

      - name: Verificar tudo (gerador, acessibilidade das saídas, biblioteca, lac, opções, pacotes, sintaxe)
        run: bash tools/verificar.sh

      - name: Guardar o relatório SARIF do conteúdo de exemplo
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linguagem-acessivel-sarif
          path: linguagem-acessivel.sarif
          if-no-files-found: ignore

      - name: Montar a página (sem nenhum curso salvo)
        run: |
          mkdir -p site/wheels
          cp web/index.html web/*.js web/*.css tools/gerador.py site/
          python -c "import shutil;shutil.copytree('tools/conteudo','site/conteudo',ignore=shutil.ignore_patterns('__pycache__','*.pyc'))"
          cp -r web/config site/config
          cp -r web/lib site/lib
          cp -r web/vendor site/vendor
          cp -r tools/temas site/temas
          cp -r tools/fontes site/fontes
          cp -r web/exemplo site/exemplo
          cp CHANGELOG.md site/
          for f in index.html changelog.js motor-python.js lib/linguagem-acessivel/index.js exemplo/treinamento.md config/opcoes.yaml conteudo/mermaid.py; do test -f "site/$f" || { echo "faltando em site/: $f"; exit 1; }; done
          pip download --no-deps --only-binary=:all: --dest site/wheels python-docx python-pptx XlsxWriter typing_extensions
          python -c "import os,json;json.dump(sorted(f for f in os.listdir('site/wheels') if f.endswith('.whl')),open('site/wheels/wheels.json','w'))"
          touch site/.nojekyll
          ls -R site

      - name: Chave do cache dos modelos
        id: chave_modelos
        env:
          MODELOS_LOCAIS: ${{ vars.MODELOS_LOCAIS || 'piper-ptbr,piper-catalogo' }}
        run: echo "perfis=$(echo "$MODELOS_LOCAIS" | tr -c 'A-Za-z0-9_.-' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache dos modelos de voz
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/modelos
          key: modelos-${{ hashFiles('web/modelos.json') }}-${{ steps.chave_modelos.outputs.perfis }}

      - name: Hospedar modelos de voz no site (opcional)
        continue-on-error: true
        env:
          MODELOS_LOCAIS: ${{ vars.MODELOS_LOCAIS || 'piper-ptbr,piper-catalogo' }}
          BIBLIOTECAS_LOCAIS: ${{ vars.BIBLIOTECAS_LOCAIS || 'piper,kokoro,espeak,lamejs' }}
        run: |
          python tools/hospedar_modelos.py --config web/modelos.json --saida site --cache .cache/modelos --perfis "$MODELOS_LOCAIS" --bibliotecas "$BIBLIOTECAS_LOCAIS"
          du -sh site || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Enviar site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # Roteiro de validação no Google Chrome (tools/testes). Se falhar, a página não é publicada.
  testes:
    needs: classificar
    if: needs.classificar.outputs.publicar == 'true'
    uses: ./.github/workflows/testes-navegador.yml
    with:
      navegadores: '["chrome"]'

  deploy:
    needs: [build, testes]
    if: needs.build.result == 'success' && needs.testes.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir que main ainda aponta para o SHA validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          atual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$atual" = "$GITHUB_SHA"
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
