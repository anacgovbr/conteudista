name: Testes seletivos

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      completo:
        description: Executar suíte completa
        type: boolean
        default: true
  schedule:
    - cron: '15 3 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classificar:
    runs-on: ubuntu-latest
    outputs:
      completo: ${{ steps.plano.outputs.completo || 'true' }}
      estaticos: ${{ steps.plano.outputs.estaticos_json || '[]' }}
      navegador: ${{ steps.plano.outputs.navegador_json || '[]' }}
      gerador_estaticos: ${{ steps.plano.outputs.gerador_estaticos || 'true' }}
      gerador_navegador: ${{ steps.plano.outputs.gerador_navegador || 'true' }}
      delegado: ${{ steps.plano.outputs.delegado_publicacao || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true') || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Classificar mudanças
        id: plano
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          EVENTO: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMPLETO: ${{ inputs.completo || github.ref_type == 'tag' }}
        run: |
          args=(--base "$BASE" --head HEAD --evento "$EVENTO" --branch "$BRANCH" --saida selecao.json)
          if [ "$EVENTO" = pull_request ]; then args+=(--merge-base); fi
          if [ "$COMPLETO" = true ]; then args+=(--completo); fi
          python tools/testes/classificar_mudancas.py "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: selecao-testes
          path: selecao.json
          retention-days: 14

  minimos:
    name: Mínimos
    needs: classificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/testes/executar_seletivos.py --grupos minimos,versao --saida relatorio-minimos
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-minimos
          path: relatorio-minimos
          retention-days: 14

  estaticos:
    name: Seletivos sem navegador
    needs: classificar
    if: needs.classificar.outputs.completo != 'true' && needs.classificar.outputs.estaticos != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependências do gerador somente quando necessárias
        if: needs.classificar.outputs.gerador_estaticos == 'true'
        run: pip install -r tools/requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: selecao-testes
      - run: python tools/testes/executar_seletivos.py --selecao selecao.json --tipo estatico --saida relatorio-estaticos
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-estaticos
          path: relatorio-estaticos
          retention-days: 14

  navegador:
    name: Seletivos Chrome
    needs: classificar
    if: needs.classificar.outputs.completo != 'true' && needs.classificar.outputs.navegador != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/testes/requirements.txt
            tools/testes/requirements-estaticos.txt
      - run: pip install -r tools/testes/requirements.txt
      - name: Instalar gerador somente quando necessário
        if: needs.classificar.outputs.gerador_navegador == 'true'
        run: pip install -r tools/requirements.txt
      - run: python -m playwright install --with-deps chrome
      - uses: actions/download-artifact@v5
        with:
          name: selecao-testes
      - run: python tools/testes/executar_seletivos.py --selecao selecao.json --tipo navegador --saida relatorio-navegador
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-navegador
          path: relatorio-navegador
          retention-days: 14

  completo:
    name: Completo
    needs: classificar
    if: needs.classificar.outputs.completo == 'true' && needs.classificar.outputs.delegado != 'true'
    uses: ./.github/workflows/testes-navegador.yml
    with:
      navegadores: '["chrome"]'
      completo: true

  resumo:
    name: Resumo obrigatório
    needs: [classificar, minimos, estaticos, navegador, completo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar resultados sem mascarar falhas
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          DELEGADO: ${{ needs.classificar.outputs.delegado }}
        run: |
          python - <<'PY'
          import json, os
          resultados = json.loads(os.environ['RESULTADOS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumo:
              resumo.write('## Resultado dos jobs\n\n| Job | Resultado |\n|---|---|\n')
              for nome, job in resultados.items():
                  resumo.write(f'| {nome} | {job["result"]} |\n')
              if os.environ['DELEGADO'] == 'true':
                  resumo.write('\nA bateria completa deste SHA e obrigatoria no workflow Publicar pagina. Este resumo nao autoriza deploy.\n')
          if any(job['result'] not in ('success', 'skipped') for job in resultados.values()):
              raise SystemExit(1)
          PY