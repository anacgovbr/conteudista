# yaml-language-server: $schema=opcoes.schema.json
# =====================================================================
# Conteudista · opções padrão
# Define como cada opção COMEÇA para quem abre o Conteudista.
# Se a pessoa já mudou a opção no navegador, vale a escolha dela.
# "Restaurar padrão" (rodapé da página) volta tudo para este arquivo.
#
# Como mudar: troque o valor depois dos dois-pontos, salve e publique.
#   ligado / desligado  (também aceita sim / não)
# Use 2 espaços para recuar. Não use tabulação.
# Linha que começa com # é comentário.
# =====================================================================

versao: 1

editor:  # Editor
  # Modo do editor ao abrir. editar: só o texto · dividido: texto e prévia · previa: só a prévia. [editar | dividido | previa]
  modo_inicial: dividido

  imagens:
    # Reduzir imagens: recomprimir também as acima de 300 KB [ligado | desligado]
    recomprimir_grandes: ligado

aplicativo:  # Aplicativo
  # Layout (tema) dos arquivos gerados [govbr | anac20_claro | anac20_escuro | classico]
  layout: govbr
  # Alto contraste no aplicativo [ligado | desligado]
  alto_contraste: desligado

salvar:  # Salvar e Histórico
  # Salvar automaticamente neste navegador [ligado | desligado]
  automaticamente: ligado
  # Lembrar os links criados neste navegador [ligado | desligado]
  lembrar_links: ligado
  # Guardar automaticamente cada geração no Histórico [ligado | desligado]
  guardar_cada_geracao: ligado
  # Quantas gerações o Histórico guarda [1 a 100]
  limite_de_geracoes: 10

link:  # Link criptografado
  # Onde guardar o link criptografado [autocontido | privatebin]
  onde_guardar: autocontido
  # PrivateBin: prazo de validade do link [1_hora | 1_dia | 1_semana | 1_mes | 1_ano | nunca]
  expira_em: 1_semana
  # PrivateBin: apagar após a primeira leitura [ligado | desligado]
  apagar_apos_primeira_leitura: desligado
  # PrivateBin: enviar as imagens como anexo (ZIP) [ligado | desligado]
  imagens_como_anexo: ligado

importar:  # Importar
  # Aba que abre em Importar. link: sempre a aba Link (padrão). ultima: a última usada; na primeira vez, Salvos (se houver) ou Computador. [link | ultima | salvos | computador | colar]
  aba_inicial: link

celular:  # Celular
  # Celular: barra do editor em até duas linhas, com os botões agrupados em menus [ligado | desligado]
  barra_compacta: ligado
  # Celular: esconder "Imagens do texto" abaixo do editor (abre por Inserir › Imagens do texto) [ligado | desligado]
  imagens_recolhidas: ligado

acessibilidade_texto:  # Acessibilidade do texto
  # Acessibilidade do texto: mostrar também as sugestões de linguagem simples (desligado: só o que é para corrigir) [ligado | desligado]
  mostrar_sugestoes: ligado
  # Acessibilidade do texto: palavras por frase antes da sugestão "frase longa" [10 a 60]
  limite_frase_longa: 25
  # Acessibilidade do texto: aviso perto de "Gerar arquivos" quando há itens para corrigir (nunca bloqueia) [ligado | desligado]
  aviso_ao_gerar: ligado
  # Acessibilidade do texto: confirmar antes de gerar quando há itens para corrigir [ligado | desligado]
  confirmar_ao_gerar: ligado
  # Incluir o relatório HTML de acessibilidade no ZIP dos arquivos gerados [ligado | desligado]
  incluir_relatorio_no_zip: desligado
  # Acessibilidade do texto: aba "Pedir ajuda a uma IA" nas janelas Descrever imagem e Simplificar trecho (desligado: só escrever) [ligado | desligado]
  ajuda_ia: ligado
  # Acessibilidade do texto: sublinhar no editor os trechos para corrigir [ligado | desligado]
  marcas_no_texto: ligado
  # Acessibilidade do texto: sublinhar também as sugestões (linha pontilhada) [ligado | desligado]
  marcas_sugestoes: desligado
  # Nível das regras. Regras para corrigir podem virar sugestão ou ser desligadas; sugestões só podem ser desligadas.
  regras:
    i1: corrigir
    i2: corrigir
    e1: corrigir
    e2: corrigir
    e3: corrigir
    k1: corrigir
    f1: sugestao
    f2: sugestao
    f3: sugestao
    s1: sugestao
    n1: sugestao

acessibilidade_arquivos:  # Acessibilidade dos arquivos gerados
  # Incluir controle VLibras no HTML (carregado apenas após clique) [ligado | desligado]
  vlibras: ligado

narracao:  # Narração (aba Gerar)
  # Narração dos slides (gerar áudio das notas) [ligado | desligado]
  narrar_slides: desligado
  # Avançar os slides sozinho ao fim da narração [ligado | desligado]
  avancar_sozinho: desligado
  # Formato do áudio da narração [mp3 | ogg | wav]
  formato_audio: mp3

locucao:  # Locução
  # Locução: carregar os recursos de áudio ao abrir a página [ligado | desligado]
  carregar_audio_ao_abrir: desligado
  # Locução: formato do arquivo [mp3 | ogg | wav]
  formato_audio: mp3
  # Locução: começar em "Notas dos slides" (desligado: texto livre) [ligado | desligado]
  notas_dos_slides: ligado
