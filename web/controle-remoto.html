<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1351b4"><title>Controle remoto - Conteudista</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font:16px/1.5 system-ui,sans-serif}main{max-width:520px;margin:auto;padding:20px}h1{font-size:1.4rem;margin:.2rem 0}.card{background:white;border:1px solid #ccd5e0;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #142b4d12}#status{font-weight:700;color:#555}#slide{font-size:1.1rem;font-weight:700;margin:12px 0}#notes{white-space:pre-wrap;color:#49566b}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}button{min-height:72px;border:0;border-radius:12px;background:#1351b4;color:white;font-size:1.2rem;font-weight:700}#play{width:100%;background:#155bcb}button:disabled{background:#8795a8}button:focus-visible{outline:4px dashed #c2850c;outline-offset:3px}small{color:#596579}
</style>
</head>
<body><main>
<h1>Controle remoto</h1>
<section class="card" aria-live="polite"><p id="status">Iniciando conexão…</p><p id="slide">Aguardando a apresentação</p><p id="notes"></p></section>
<div class="buttons"><button id="prev" type="button" disabled>← Anterior</button><button id="next" type="button" disabled>Próximo →</button></div>
<button id="play" type="button" disabled>▶ Reproduzir / Pausar</button>
<p><small>As mensagens trafegam cifradas por um relay HTTPS; só quem tem o QR Code da apresentação consegue ler ou enviar comandos.</small></p>
</main>
<script>
(function(){'use strict';
var RELAY=window.CONTEUDISTA_RELAY||'https://ntfy.sh',$=function(x){return document.getElementById(x)},btns=[$('prev'),$('next'),$('play')];
function fail(t){$('status').textContent=t;btns.forEach(function(b){b.disabled=true})}
function b64(u){var s='';u.forEach(function(b){s+=String.fromCharCode(b)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64(t){var s=atob(t.replace(/-/g,'+').replace(/_/g,'/')),u=new Uint8Array(s.length);for(var k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u}
var h=location.hash.slice(1).split('.'),topic=h[0],raw=h[1];
if(!topic||!raw||!(window.crypto&&crypto.subtle)){fail('Abra esta página pelo QR Code exibido na apresentação.');return}
crypto.subtle.importKey('raw',ub64(raw),'AES-GCM',false,['encrypt','decrypt']).then(function(key){
  function enviar(o){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(o))).then(function(c){var u=new Uint8Array(12+c.byteLength);u.set(iv);u.set(new Uint8Array(c),12);return fetch(RELAY+'/'+topic+'-c',{method:'POST',body:b64(u)})}).catch(function(){$('status').textContent='Sem conexão com o relay. Tente de novo.'})}
  var es=new EventSource(RELAY+'/'+topic+'-s/sse');
  es.onopen=function(){enviar({c:'hello'})};
  es.onmessage=function(e){var j;try{j=JSON.parse(e.data)}catch(x){return}if(j.event!=='message')return;var u=ub64(j.message);
    crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)).then(function(p){var m=JSON.parse(new TextDecoder().decode(p));
      $('status').textContent='Conectado à apresentação';$('slide').textContent='Slide '+m.slide+' de '+m.total+(m.title?' — '+m.title:'');$('notes').textContent=m.notes||'';
      btns.forEach(function(b){b.disabled=false});$('prev').disabled=m.slide<=1;$('next').disabled=m.slide>=m.total}).catch(function(){})};
  es.onerror=function(){if(es.readyState===2)fail('Conexão encerrada. Reabra o controle pelo QR Code.');else $('status').textContent='Reconectando…'};
  $('prev').onclick=function(){enviar({c:'prev'})};$('next').onclick=function(){enviar({c:'next'})};$('play').onclick=function(){enviar({c:'play'})};
  $('status').textContent='Aguardando a apresentação…'
}).catch(function(){fail('Código inválido. Reabra o controle pelo QR Code da apresentação.')});
})();
</script></body></html>
